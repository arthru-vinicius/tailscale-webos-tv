<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailscale TV</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="page">
    <div class="wrap">

      <div class="title-row">
        <img src="icon.png" class="logo" alt="Tailscale">
        <div>
          <h1>Tailscale TV</h1>
          <div class="subtitle">Tailscale client for webOS Homebrew</div>
        </div>
      </div>

      <div class="buttons">
        <button class="upload" onclick="installComponents()">Install / update</button>
        <button class="primary" onclick="startTailscale()">Start</button>
        <button class="danger" onclick="stopTailscale()">Stop</button>
        <button onclick="statusTailscale()">Status</button>
        <button onclick="showLog()">Log</button>
      </div>

      <div class="authkey-row">
        <input id="authKeyInput" type="text" placeholder="tskey-auth-..." autocomplete="off" spellcheck="false">
        <button class="upload" onclick="saveAuthKey()">Save auth key</button>
      </div>

      <div class="toggle-row">
        <label class="toggle-box">
          <input id="autostartToggle" type="checkbox" onchange="toggleAutostart()">
          <span>Start on boot</span>
        </label>
      </div>

      <div id="statusLine" class="status-line">Ready.</div>

      <div class="output-box">
        <pre id="out" tabindex="0">Tailscale TV ready.</pre>
      </div>

      <div class="scroll-row">
        <button onclick="scrollOutput(-1)">&#9650; Up</button>
        <button onclick="scrollOutput(1)">&#9660; Down</button>
        <button onclick="scrollOutputToEnd()">End</button>
      </div>

      <div class="hint">
        Generate a reusable auth key at
        <code>console.tailscale.com/admin/settings/keys</code>,
        type it above, press <b>Save auth key</b>, then <b>Start</b>.
      </div>

      <div class="buttons danger-row">
        <button class="danger" onclick="cleanupAll()">Uninstall</button>
      </div>

    </div>
  </div>

  <script src="lib/webOSTVjs-1.2.4/webOSTV.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
